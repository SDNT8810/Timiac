<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1300" viewBox="0 0 1700 1300" role="img" aria-labelledby="title desc">
<title id="title">Timiac master wiring: existing 24 V to 3.3 V converter and NPN NC infrared sensor</title>
<desc id="desc">DS3231 uses GPIO21 and GPIO22. E3F-DS30B2 uses three resistors into GPIO27. GPIO18 and GPIO19 remain unused. All grounds share the existing PCB ground.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172b36} .wire{fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1700" height="1300" fill="#f7f9fb"/>
<text x="45" y="48" font-size="31" style="fill:#172b36" font-weight="bold" text-anchor="start">TIMIAC  /  MASTER BOARD WIRING</text>
<text x="45" y="83" font-size="22" style="fill:#172b36" font-weight="normal" text-anchor="start">Existing 24 V → 3.3 V converter · New sensor on GPIO27 · GPIO18/19 stay unused</text>
<rect x="40" y="115" width="1620" height="385" rx="12" fill="#fff" stroke="#c4ced7" stroke-width="2"/>
<text x="65" y="145" font-size="21" style="fill:#172b36" font-weight="bold" text-anchor="start">1   EXISTING POWER + CLOCK CONNECTIONS</text>
<rect x="65" y="175" width="195" height="220" rx="12" fill="#fff3f1" stroke="#c4ced7" stroke-width="2"/>
<text x="85" y="208" font-size="21" style="fill:#172b36" font-weight="bold" text-anchor="start">24 V DC INPUT</text>
<text x="85" y="240" font-size="18" style="fill:#172b36" font-weight="normal" text-anchor="start">From your PSU</text>
<text x="240" y="281" font-size="20" style="fill:#bb352e" font-weight="normal" text-anchor="end">+24 V</text>
<text x="240" y="341" font-size="20" style="fill:#344b60" font-weight="normal" text-anchor="end">0 V</text>
<rect x="365" y="175" width="265" height="220" rx="12" fill="#eef8f0" stroke="#c4ced7" stroke-width="2"/>
<text x="385" y="208" font-size="21" style="fill:#172b36" font-weight="bold" text-anchor="start">EXISTING DC–DC</text>
<text x="385" y="240" font-size="19" style="fill:#172b36" font-weight="normal" text-anchor="start">Keep output at 3.3 V</text>
<text x="385" y="281" font-size="19" style="fill:#bb352e" font-weight="normal" text-anchor="start">IN+</text>
<text x="610" y="281" font-size="19" style="fill:#28804c" font-weight="normal" text-anchor="end">OUT+  3.3 V</text>
<text x="385" y="341" font-size="19" style="fill:#344b60" font-weight="normal" text-anchor="start">IN−</text>
<text x="610" y="341" font-size="19" style="fill:#344b60" font-weight="normal" text-anchor="end">OUT− / GND</text>
<polyline class="wire" points="260,275 365,275" stroke="#bb352e" stroke-width="4" data-net="+24V"/>
<polyline class="wire" points="260,335 365,335" stroke="#344b60" stroke-width="4" data-net="GND"/>
<rect x="805" y="175" width="315" height="220" rx="12" fill="#f0edfa" stroke="#c4ced7" stroke-width="2"/>
<text x="825" y="208" font-size="23" style="fill:#172b36" font-weight="bold" text-anchor="start">MASTER ESP32</text>
<text x="825" y="240" font-size="16" style="fill:#172b36" font-weight="normal" text-anchor="start">GPIO labels, not header numbers</text>
<text x="825" y="281" font-size="19" style="fill:#28804c" font-weight="normal" text-anchor="start">3V3</text>
<text x="825" y="341" font-size="19" style="fill:#344b60" font-weight="normal" text-anchor="start">GND</text>
<polyline class="wire" points="630,275 805,275" stroke="#28804c" stroke-width="4" data-net="+3V3"/>
<polyline class="wire" points="630,335 805,335" stroke="#344b60" stroke-width="4" data-net="GND"/>
<text x="1098" y="273" font-size="18" style="fill:#28804c" font-weight="normal" text-anchor="end">3V3</text>
<text x="1098" y="313" font-size="18" style="fill:#344b60" font-weight="normal" text-anchor="end">GND</text>
<text x="1098" y="353" font-size="18" style="fill:#147b8d" font-weight="normal" text-anchor="end">GPIO21</text>
<text x="1098" y="383" font-size="18" style="fill:#b96b13" font-weight="normal" text-anchor="end">GPIO22</text>
<rect x="1350" y="175" width="270" height="220" rx="12" fill="#eef7fb" stroke="#c4ced7" stroke-width="2"/>
<text x="1370" y="208" font-size="22" style="fill:#172b36" font-weight="bold" text-anchor="start">DS3231 CLOCK</text>
<polyline class="wire" points="1120,267 1350,267" stroke="#28804c" stroke-width="4" data-net="+3V3"/>
<text x="1370" y="273" font-size="19" style="fill:#28804c" font-weight="normal" text-anchor="start">VCC: 3.3 V</text>
<polyline class="wire" points="1120,307 1350,307" stroke="#344b60" stroke-width="4" data-net="GND"/>
<text x="1370" y="313" font-size="19" style="fill:#344b60" font-weight="normal" text-anchor="start">GND</text>
<polyline class="wire" points="1120,347 1350,347" stroke="#147b8d" stroke-width="4" data-net="SDA"/>
<text x="1370" y="353" font-size="19" style="fill:#147b8d" font-weight="normal" text-anchor="start">SDA</text>
<polyline class="wire" points="1120,377 1350,377" stroke="#b96b13" stroke-width="4" data-net="SCL"/>
<text x="1370" y="383" font-size="19" style="fill:#b96b13" font-weight="normal" text-anchor="start">SCL</text>
<text x="1370" y="428" font-size="17" style="fill:#172b36" font-weight="normal" text-anchor="start">SQW and 32K: not connected</text>
<text x="65" y="438" font-size="19" style="fill:#172b36" font-weight="normal" text-anchor="start">Keep existing PCB power traces. Remove the ultrasonic module; leave GPIO18/19 untouched.</text>
<text x="65" y="472" font-size="18" style="fill:#172b36" font-weight="normal" text-anchor="start">Motor boards communicate by Wi-Fi: no master UART wires. Disconnect 24 V before USB flashing.</text>
<circle cx="980" cy="395" r="6" fill="#7751b9"/>
<text x="995" y="410" font-size="20" style="fill:#7751b9" font-weight="bold" text-anchor="start">GPIO27</text>
<text x="1300" y="543" font-size="19" style="fill:#7751b9" font-weight="normal" text-anchor="start">New signal wire to GPIO27</text>
<rect x="40" y="555" width="1545" height="530" rx="12" fill="#fff" stroke="#c4ced7" stroke-width="2"/>
<text x="65" y="590" font-size="22" style="fill:#172b36" font-weight="bold" text-anchor="start">2   VERIFIED NPN NC SENSOR — 68 kΩ / 10 kΩ DIVIDER + 4.7 kΩ PULL-UP</text>
<rect x="80" y="680" width="280" height="260" rx="12" fill="#fff" stroke="#c4ced7" stroke-width="2"/>
<text x="100" y="714" font-size="24" style="fill:#172b36" font-weight="bold" text-anchor="start">HESCHEN</text>
<text x="100" y="746" font-size="23" style="fill:#172b36" font-weight="bold" text-anchor="start">E3F-DS30B2</text>
<text x="100" y="775" font-size="18" style="fill:#172b36" font-weight="normal" text-anchor="start">NPN normally closed</text>
<text x="340" y="817" font-size="18" style="fill:#925429" font-weight="normal" text-anchor="end">BROWN / +V</text>
<text x="340" y="867" font-size="18" style="fill:#172b36" font-weight="normal" text-anchor="end">BLACK / OUT</text>
<text x="340" y="917" font-size="18" style="fill:#1675b8" font-weight="normal" text-anchor="end">BLUE / 0 V</text>
<polyline class="wire" points="360,810 470,810" stroke="#925429" stroke-width="4" data-net="+24V"/>
<polyline class="wire" points="470,810 470,630 800,630" stroke="#bb352e" stroke-width="4" data-net="+24V"/>
<text x="480" y="656" font-size="18" style="fill:#bb352e" font-weight="normal" text-anchor="start">+24 V: same master-board input</text>
<polyline class="wire" points="800,630 800,675" stroke="#bb352e" stroke-width="4" data-net="+24V"/>
<rect x="788" y="675" width="24" height="80" rx="0" fill="#fff6e8" stroke="#344b60" stroke-width="2"/>
<polyline class="wire" points="800,755 800,800" stroke="#172b36" stroke-width="4" data-net="SENSOR_OUT"/>
<text x="835" y="707" font-size="21" style="fill:#172b36" font-weight="bold" text-anchor="start">R1: 4.7 kΩ pull-up</text>
<text x="835" y="735" font-size="18" style="fill:#172b36" font-weight="normal" text-anchor="start">1%, ¼ W</text>
<polyline class="wire" points="360,860 650,860 650,800 920,800" stroke="#172b36" stroke-width="4" data-net="SENSOR_OUT"/>
<circle cx="800" cy="800" r="6" fill="#172b36"/>
<text x="690" y="837" font-size="18" style="fill:#172b36" font-weight="normal" text-anchor="start">A: black output</text>
<rect x="920" y="788" width="100" height="24" rx="0" fill="#fff6e8" stroke="#344b60" stroke-width="2"/>
<text x="970" y="762" font-size="21" style="fill:#172b36" font-weight="bold" text-anchor="middle">R2: 68 kΩ</text>
<text x="970" y="782" font-size="16" style="fill:#172b36" font-weight="normal" text-anchor="middle">1%, ¼ W</text>
<polyline class="wire" points="1020,800 1250,800" stroke="#7751b9" stroke-width="4" data-net="GPIO27"/>
<circle cx="1250" cy="800" r="6" fill="#7751b9"/>
<text x="1245" y="767" font-size="21" style="fill:#7751b9" font-weight="bold" text-anchor="middle">TEST / GPIO27</text>
<polyline class="wire" points="1250,800 1250,855" stroke="#7751b9" stroke-width="4" data-net="GPIO27"/>
<rect x="1238" y="855" width="24" height="80" rx="0" fill="#fff6e8" stroke="#344b60" stroke-width="2"/>
<text x="1290" y="891" font-size="21" style="fill:#172b36" font-weight="bold" text-anchor="start">R3: 10 kΩ</text>
<text x="1290" y="919" font-size="18" style="fill:#172b36" font-weight="normal" text-anchor="start">1%, ¼ W</text>
<polyline class="wire" points="1250,935 1250,1010 470,1010 470,910" stroke="#344b60" stroke-width="4" data-net="GND"/>
<polyline class="wire" points="470,910 360,910" stroke="#1675b8" stroke-width="4" data-net="GND"/>
<text x="490" y="1043" font-size="18" style="fill:#344b60" font-weight="normal" text-anchor="start">GND: sensor blue + PSU 0 V + converter OUT− + ESP32 GND + clock GND</text>
<text x="680" y="970" font-size="19" style="fill:#bb352e" font-weight="bold" text-anchor="start">Blue = GND. Black = OUT. R1 supplies the HIGH level.</text>
<text x="680" y="1000" font-size="19" style="fill:#bb352e" font-weight="normal" text-anchor="start">Only the R2/R3 junction goes to GPIO27.</text>
<polyline class="wire" points="980,395 980,515 1640,515 1640,800 1250,800" stroke="#7751b9" stroke-width="4" data-net="GPIO27"/>
<rect x="40" y="1110" width="1620" height="155" rx="12" fill="#edf5fa" stroke="#c4ced7" stroke-width="2"/>
<text x="65" y="1145" font-size="20" style="fill:#172b36" font-weight="bold" text-anchor="start">CHECK BEFORE CONNECTING THE GPIO</text>
<text x="65" y="1178" font-size="20" style="fill:#172b36" font-weight="normal" text-anchor="start">NC sensor clear → GPIO test point near 0 V. Hand detected → approximately 2.90 V at a 24.0 V supply.</text>
<text x="65" y="1210" font-size="19" style="fill:#172b36" font-weight="normal" text-anchor="start">Brown = +24 V. Blue = PSU 0 V / ESP32 GND. Black = sensor OUT, never directly to GPIO27.</text>
<text x="65" y="1242" font-size="18" style="fill:#172b36" font-weight="normal" text-anchor="start">NPN NC only: retain all three resistors. Ordinary INPUT, no internal pull-up. Confirm test voltage before connection.</text>
</svg>
