<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1300" viewBox="0 0 1700 1300" role="img" aria-labelledby="title desc">
<title id="title">Timiac master wiring: existing power and analog hand sensor</title>
<desc id="desc">DS3231 uses GPIO21 and GPIO22. Move only the installed sensor signal from GPIO27 to ADC1 GPIO34; keep its resistors. GPIO18 and GPIO19 remain unused.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172b36} .wire{fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1700" height="1300" fill="#f7f9fb"/>
<text x="45" y="48" font-size="31" style="fill:#172b36" font-weight="bold" text-anchor="start">TIMIAC  /  MASTER BOARD WIRING</text>
<text x="45" y="83" font-size="22" style="fill:#172b36" font-weight="normal" text-anchor="start">Existing 24 V → 3.3 V converter · New sensor on GPIO34 · GPIO18/19 stay unused</text>
<rect x="40" y="115" width="1620" height="385" rx="12" fill="#fff" stroke="#c4ced7" stroke-width="2"/>
<text x="65" y="145" font-size="21" style="fill:#172b36" font-weight="bold" text-anchor="start">1   EXISTING POWER + CLOCK CONNECTIONS</text>
<rect x="65" y="175" width="195" height="220" rx="12" fill="#fff3f1" stroke="#c4ced7" stroke-width="2"/>
<text x="85" y="208" font-size="21" style="fill:#172b36" font-weight="bold" text-anchor="start">24 V DC INPUT</text>
<text x="85" y="240" font-size="18" style="fill:#172b36" font-weight="normal" text-anchor="start">From your PSU</text>
<text x="240" y="281" font-size="20" style="fill:#bb352e" font-weight="normal" text-anchor="end">+24 V</text>
<text x="240" y="341" font-size="20" style="fill:#344b60" font-weight="normal" text-anchor="end">0 V</text>
<rect x="365" y="175" width="265" height="220" rx="12" fill="#eef8f0" stroke="#c4ced7" stroke-width="2"/>
<text x="385" y="208" font-size="21" style="fill:#172b36" font-weight="bold" text-anchor="start">EXISTING DC–DC</text>
<text x="385" y="240" font-size="19" style="fill:#172b36" font-weight="normal" text-anchor="start">Keep output at 3.3 V</text>
<text x="385" y="281" font-size="19" style="fill:#bb352e" font-weight="normal" text-anchor="start">IN+</text>
<text x="610" y="281" font-size="19" style="fill:#28804c" font-weight="normal" text-anchor="end">OUT+  3.3 V</text>
<text x="385" y="341" font-size="19" style="fill:#344b60" font-weight="normal" text-anchor="start">IN−</text>
<text x="610" y="341" font-size="19" style="fill:#344b60" font-weight="normal" text-anchor="end">OUT− / GND</text>
<polyline class="wire" points="260,275 365,275" stroke="#bb352e" stroke-width="4" data-net="+24V"/>
<polyline class="wire" points="260,335 365,335" stroke="#344b60" stroke-width="4" data-net="GND"/>
<rect x="805" y="175" width="315" height="220" rx="12" fill="#f0edfa" stroke="#c4ced7" stroke-width="2"/>
<text x="825" y="208" font-size="23" style="fill:#172b36" font-weight="bold" text-anchor="start">MASTER ESP32</text>
<text x="825" y="240" font-size="16" style="fill:#172b36" font-weight="normal" text-anchor="start">GPIO labels, not header numbers</text>
<text x="825" y="281" font-size="19" style="fill:#28804c" font-weight="normal" text-anchor="start">3V3</text>
<text x="825" y="341" font-size="19" style="fill:#344b60" font-weight="normal" text-anchor="start">GND</text>
<polyline class="wire" points="630,275 805,275" stroke="#28804c" stroke-width="4" data-net="+3V3"/>
<polyline class="wire" points="630,335 805,335" stroke="#344b60" stroke-width="4" data-net="GND"/>
<text x="1098" y="273" font-size="18" style="fill:#28804c" font-weight="normal" text-anchor="end">3V3</text>
<text x="1098" y="313" font-size="18" style="fill:#344b60" font-weight="normal" text-anchor="end">GND</text>
<text x="1098" y="353" font-size="18" style="fill:#147b8d" font-weight="normal" text-anchor="end">GPIO21</text>
<text x="1098" y="383" font-size="18" style="fill:#b96b13" font-weight="normal" text-anchor="end">GPIO22</text>
<rect x="1350" y="175" width="270" height="220" rx="12" fill="#eef7fb" stroke="#c4ced7" stroke-width="2"/>
<text x="1370" y="208" font-size="22" style="fill:#172b36" font-weight="bold" text-anchor="start">DS3231 CLOCK</text>
<polyline class="wire" points="1120,267 1350,267" stroke="#28804c" stroke-width="4" data-net="+3V3"/>
<text x="1370" y="273" font-size="19" style="fill:#28804c" font-weight="normal" text-anchor="start">VCC: 3.3 V</text>
<polyline class="wire" points="1120,307 1350,307" stroke="#344b60" stroke-width="4" data-net="GND"/>
<text x="1370" y="313" font-size="19" style="fill:#344b60" font-weight="normal" text-anchor="start">GND</text>
<polyline class="wire" points="1120,347 1350,347" stroke="#147b8d" stroke-width="4" data-net="SDA"/>
<text x="1370" y="353" font-size="19" style="fill:#147b8d" font-weight="normal" text-anchor="start">SDA</text>
<polyline class="wire" points="1120,377 1350,377" stroke="#b96b13" stroke-width="4" data-net="SCL"/>
<text x="1370" y="383" font-size="19" style="fill:#b96b13" font-weight="normal" text-anchor="start">SCL</text>
<text x="1370" y="428" font-size="17" style="fill:#172b36" font-weight="normal" text-anchor="start">SQW and 32K: not connected</text>
<text x="65" y="438" font-size="19" style="fill:#172b36" font-weight="normal" text-anchor="start">Keep existing PCB power traces. Remove the ultrasonic module; leave GPIO18/19 untouched.</text>
<text x="65" y="472" font-size="18" style="fill:#172b36" font-weight="normal" text-anchor="start">Motor boards communicate by Wi-Fi: no master UART wires. Disconnect 24 V before USB flashing.</text>
<circle cx="980" cy="395" r="6" fill="#7751b9"/>
<text x="995" y="410" font-size="20" style="fill:#7751b9" font-weight="bold" text-anchor="start">GPIO34</text>
<text x="1300" y="543" font-size="19" style="fill:#7751b9" font-weight="normal" text-anchor="start">New signal wire to GPIO34</text>
<rect x="40" y="555" width="1620" height="530" rx="12" fill="#fff" stroke="#c4ced7" stroke-width="2"/>
<text x="65" y="590" font-size="24" style="fill:#172b36" font-weight="bold" text-anchor="start">2   INSTALLED SENSOR: MOVE ONLY GPIO27 SIGNAL WIRE TO GPIO34</text>
<rect x="80" y="680" width="310" height="230" rx="12" fill="#fff" stroke="#c4ced7" stroke-width="2"/>
<text x="105" y="720" font-size="22" style="fill:#172b36" font-weight="bold" text-anchor="start">EXISTING HAND SENSOR</text>
<text x="105" y="760" font-size="20" style="fill:#172b36" font-weight="normal" text-anchor="start">Keep its power wiring</text>
<text x="105" y="795" font-size="20" style="fill:#172b36" font-weight="normal" text-anchor="start">Keep its ground wiring</text>
<text x="365" y="857" font-size="20" style="fill:#7751b9" font-weight="normal" text-anchor="end">Existing output</text>
<rect x="590" y="680" width="430" height="230" rx="12" fill="#fff6e8" stroke="#c4ced7" stroke-width="2"/>
<text x="615" y="720" font-size="21" style="fill:#172b36" font-weight="bold" text-anchor="start">EXISTING RESISTOR INTERFACE</text>
<text x="615" y="763" font-size="21" style="fill:#172b36" font-weight="normal" text-anchor="start">Leave every resistor as installed.</text>
<text x="615" y="800" font-size="20" style="fill:#172b36" font-weight="normal" text-anchor="start">No new pull-up or divider changes.</text>
<text x="995" y="857" font-size="19" style="fill:#7751b9" font-weight="normal" text-anchor="end">Low-voltage junction</text>
<polyline class="wire" points="390,850 590,850" stroke="#7751b9" stroke-width="4" data-net="SENSOR_OUT"/>
<polyline class="wire" points="1020,850 1250,850" stroke="#7751b9" stroke-width="4" data-net="GPIO34"/>
<circle cx="1250" cy="850" r="6" fill="#7751b9"/>
<text x="1250" y="785" font-size="24" style="fill:#7751b9" font-weight="bold" text-anchor="middle">GPIO34 / ADC1</text>
<text x="1250" y="819" font-size="19" style="fill:#7751b9" font-weight="normal" text-anchor="middle">Analog input, no pull-up</text>
<polyline class="wire" points="980,395 980,515 1640,515 1640,850 1250,850" stroke="#7751b9" stroke-width="4" data-net="GPIO34"/>
<text x="100" y="962" font-size="22" style="fill:#172b36" font-weight="bold" text-anchor="start">Measured at the signal junction relative to ESP32 GND:</text>
<text x="100" y="1003" font-size="22" style="fill:#172b36" font-weight="normal" text-anchor="start">Clear: 0.095 V (95 mV). Hand: 0.0025 V (2.5 mV). Confirm ADC readings after the move.</text>
<text x="100" y="1046" font-size="20" style="fill:#344b60" font-weight="normal" text-anchor="start">ESP32 GND, sensor 0 V and the resistor ground remain connected exactly as before.</text>
<rect x="40" y="1110" width="1620" height="155" rx="12" fill="#edf5fa" stroke="#c4ced7" stroke-width="2"/>
<text x="65" y="1145" font-size="21" style="fill:#172b36" font-weight="bold" text-anchor="start">FIRMWARE 2026-10-20.3: ANALOG PRESENCE DETECTION</text>
<text x="65" y="1180" font-size="20" style="fill:#172b36" font-weight="normal" text-anchor="start">Detect below 40 mV, clear above 60 mV. Zero ADC counts count as low; voltage is below the ADC floor.</text>
<text x="65" y="1214" font-size="19" style="fill:#172b36" font-weight="normal" text-anchor="start">Below 100 mV the ESP32 ADC is outside its specified accurate range. Check both hand states on the dashboard.</text>
<text x="65" y="1247" font-size="19" style="fill:#bb352e" font-weight="normal" text-anchor="start">Only the existing low-voltage junction connects to the GPIO. Never connect a raw 24 V sensor wire to it.</text>
</svg>
