<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
<title id="title">Move the installed sensor signal from GPIO27 to ADC1 GPIO34</title>
<desc id="desc">Keep the installed sensor power, resistor network and common ground. Move only the existing divided signal wire to GPIO34. No resistor change is specified.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172b36}.wire{fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1400" height="680" fill="#f7f9fb"/>
<text x="45" y="55" font-size="32" style="fill:#172b36" font-weight="bold" text-anchor="start">SENSOR SIGNAL: GPIO27 → GPIO34</text>
<text x="45" y="100" font-size="24" style="fill:#172b36" font-weight="normal" text-anchor="start">Leave all installed resistors, sensor power and common ground unchanged.</text>
<rect x="65" y="190" width="350" height="230" rx="12" fill="#fff" stroke="#c4ced7" stroke-width="2"/>
<text x="90" y="235" font-size="25" style="fill:#172b36" font-weight="bold" text-anchor="start">EXISTING SENSOR</text>
<text x="90" y="278" font-size="21" style="fill:#172b36" font-weight="normal" text-anchor="start">Keep power and GND</text>
<text x="390" y="352" font-size="20" style="fill:#7751b9" font-weight="normal" text-anchor="end">Existing OUT</text>
<rect x="530" y="190" width="460" height="230" rx="12" fill="#fff6e8" stroke="#c4ced7" stroke-width="2"/>
<text x="555" y="235" font-size="25" style="fill:#172b36" font-weight="bold" text-anchor="start">EXISTING RESISTORS</text>
<text x="555" y="278" font-size="21" style="fill:#172b36" font-weight="normal" text-anchor="start">Keep the complete interface.</text>
<text x="555" y="315" font-size="21" style="fill:#172b36" font-weight="normal" text-anchor="start">No components need changing.</text>
<text x="965" y="352" font-size="20" style="fill:#7751b9" font-weight="normal" text-anchor="end">Signal junction</text>
<polyline class="wire" points="415,345 530,345" stroke="#7751b9" stroke-width="4" data-net="SENSOR_OUT"/>
<polyline class="wire" points="990,345 1150,345" stroke="#7751b9" stroke-width="4" data-net="GPIO34"/>
<circle cx="1150" cy="345" r="6" fill="#7751b9"/>
<text x="1180" y="350" font-size="29" style="fill:#7751b9" font-weight="bold" text-anchor="start">GPIO34</text>
<text x="1140" y="395" font-size="19" style="fill:#7751b9" font-weight="normal" text-anchor="start">ADC1, no pull-up</text>
<text x="65" y="480" font-size="23" style="fill:#172b36" font-weight="normal" text-anchor="start">Measured: clear ≈ 95 mV; hand ≈ 2.5 mV. These values still need ADC verification.</text>
<text x="65" y="525" font-size="22" style="fill:#172b36" font-weight="normal" text-anchor="start">Firmware: detect &lt; 40 mV; clear &gt; 60 mV; zero counts are handled as below the ADC floor.</text>
<text x="65" y="570" font-size="21" style="fill:#172b36" font-weight="normal" text-anchor="start">GPIO34 avoids ADC2 / Wi-Fi contention. Below 100 mV, absolute accuracy is not specified.</text>
<text x="65" y="624" font-size="20" style="fill:#bb352e" font-weight="normal" text-anchor="start">Connect only the existing low-voltage junction. Never connect raw sensor OUT / 24 V to an ESP32 pin.</text>
</svg>
