[platformio]
default_envs = timiac_master, timiac_master_release, timiac_board1, timiac_board2
data_dir = ../WebApp/public

[env]
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson @ 6.21.5

[esp12s]
platform = espressif8266 @ 4.2.1
board = esp12e
board_build.ldscript = eagle.flash.4m1m.ld
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

[env:timiac_master]
platform = espressif32 @ 7.1.0
board = esp32dev
board_build.partitions = default.csv
extra_scripts = pre:generate_presets.py, post:export_master.py
lib_deps =
  ${env.lib_deps}
  ESP32Async/ESPAsyncWebServer @ 3.6.0
  ESP32Async/AsyncTCP @ 3.3.2
  adafruit/RTClib @ 2.1.4
build_flags = -D TIMIAC_MASTER=1 -D TIMIAC_BOARD_ID=0

[env:timiac_master_release]
extends = env:timiac_master
build_flags = ${env:timiac_master.build_flags} -D TIMIAC_RELEASE=1
extra_scripts = pre:generate_presets.py, pre:release_assets.py, post:export_master.py

[env:timiac_board1]
extends = esp12s
build_flags = ${esp12s.build_flags} -D TIMIAC_MASTER=0 -D TIMIAC_BOARD_ID=1

[env:timiac_board2]
extends = esp12s
build_flags = ${esp12s.build_flags} -D TIMIAC_MASTER=0 -D TIMIAC_BOARD_ID=2
