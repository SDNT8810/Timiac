<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timiac remote control</title><link rel="stylesheet" href="/style.css"><script src="https://accounts.google.com/gsi/client"></script></head>
<body><main><header><strong>TIMIAC</strong><span>REMOTE CLOCK</span></header><section id="sign-in"><h1>Remote control</h1><p>Sign in with an approved administrator Google account.</p><div id="google-button"></div><p id="login-message"></p></section><section id="dashboard" hidden><div class="top"><h1>Remote control</h1><button id="sign-out">Sign out</button></div><p id="connection">Reading Timiac…</p><div class="time"><strong id="clock">--:--:--</strong><span id="date"></span></div><div class="boards"><article><small>OCTOPUS 1</small><strong id="board-a">Unknown</strong></article><article><small>OCTOPUS 2</small><strong id="board-b">Unknown</strong></article></div><div class="actions"><button data-action="home">Home</button><button data-action="open">Open</button><button data-action="close">Close</button><button data-action="show-time">Show time</button></div><form id="time-form"><label>Set local clock time <input id="local-time" type="datetime-local" step="1" required></label><button>Save time</button></form><button id="stop" class="stop">Stop</button><p id="message" role="status"></p></section></main><script type="module" src="/app.js"></script></body>
</html>
