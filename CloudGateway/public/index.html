<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timiac remote control</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
  <header><strong>TIMIAC</strong><span>REMOTE CLOCK</span></header>
  <section id="sign-in">
    <h1>Remote control</h1>
    <form id="login-form">
      <label>Username <input id="username" name="username" autocomplete="username" required maxlength="100"></label>
      <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
      <button id="login-button" type="submit">Sign in</button>
    </form>
    <p id="login-message" class="error" role="status"></p>
  </section>
  <section id="dashboard" hidden>
    <div class="top"><h1>Remote control</h1><button id="sign-out">Sign out</button></div>
    <p id="connection">Reading Timiac...</p>
    <div class="time"><strong id="clock">--:--:--</strong><span id="date"></span><span id="clock-mode"></span></div>
    <div class="boards"><article><small>OCTOPUS 1</small><strong id="board-a">Unknown</strong></article><article><small>OCTOPUS 2</small><strong id="board-b">Unknown</strong></article></div>
    <div class="actions">
      <button data-action="home">Home</button><button data-action="close">Close</button>
      <button data-action="show-time">Show time</button><button data-action="next-five">Next 5 minutes</button>
      <button data-action="next-hour">Next hour</button><button data-action="struggle">Struggle</button>
    </div>
    <label class="speed-control">Movement speed <span id="speed-value">50%</span><input id="speed" type="range" min="20" max="100" step="1" value="50"></label>
    <form id="time-form"><label>Set local clock time <input id="local-time" type="datetime-local" step="1" required></label><button id="save-time">Save time</button></form>
    <button id="stop" class="stop">Stop</button><p id="message" role="status"></p>
  </section>
</main><script type="module" src="/app.js"></script></body>
</html>
